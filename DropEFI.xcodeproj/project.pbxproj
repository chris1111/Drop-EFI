			shellPath = /bin/sh;
			shellScript = "./CreateBuild.sh\napptitle=\"DropEFI\"\nversion=\"1.0\"\n# Set Icon directory and file \niconfile=\"/System/Library/CoreServices/Finder.app/Contents/Resources/Finder.icns\"\n\necho \"Remove Old if exist\"\nAPP=/Applications/Drop-EFI.app\nif [ -d \"$APP\" ]; then\n    osascript -e 'tell application \"System Events\" to make login item at end with properties {path:\"/Applications/Drop-EFI.app\", hidden:false}'\n    Sleep 1\n    open $App\n    Sleep 1\n    osascript -e 'tell application \"System Events\" to delete login item \"Drop-EFI\"'\n    killall -c applet\n    echo \"$APP exists.\"\n    rm -rf /Applications/Drop-EFI.app\nfi\n\necho \"Remove New if exist\"\nAPPS=/Applications/DropEFI.app\nif [ -d \"$APPS\" ]; then\n    osascript -e 'tell application \"System Events\" to make login item at end with properties {path:\"/Applications/DropEFI.app\", hidden:false}'\n    Sleep 1\n    open $APPS\n    Sleep 1\n    osascript -e 'tell application \"System Events\" to delete login item \"DropEFI\"'\n    killall -c DropEFI\n    echo \"$APPS exists.\"\n    rm -rf /Applications/DropEFI.app\nfi\n\n# Install App if Yes\nresponse=$(osascript -e 'tell app \"System Events\" to display dialog \"Do you want to install the App on your Applications\\n\\nCancel for Quit\" buttons {\"Cancel\",\"Install\"} default button 2 with title \"'\"$apptitle\"' '\"$version\"'\" with icon POSIX file \"'\"$iconfile\"'\"  ')\n\naction=$(echo $response | cut -d ':' -f2)\n\n# Exit if Canceled\nif [ ! \"$action\" ] ; then\n  osascript -e 'display notification \"Program closing\" with title \"'\"$apptitle\"'\" subtitle \"User cancelled\"'\n  open ./build/Release\n  exit 0\n\nfi\n\ncp -Rp ./build/Release/DropEFI.app /Applications/DropEFI.app\nosascript -e 'tell application \"System Events\" to make login item at end with properties {path:\"/Applications/DropEFI.app\", hidden:false}'\nSleep 1\nOpen -a /Applications/\"DropEFI.app\"\n\necho \"= = = = = = = = = = = = = = = = = = = = = = = = =  \"\necho \"Create /Applications/DropEFI.app Done.\nApp is ready on Status Bar\"\necho \"= = = = = = = = = = = = = = = = = = = = = = = = =  \"\n";
